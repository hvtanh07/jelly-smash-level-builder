<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"><meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet"><meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Smash Level Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Levels">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="13" width="12" height="12" rx="3.5" fill="#E5484D"/><rect x="16" y="13" width="12" height="12" rx="3.5" fill="#2F6FEB"/><rect x="9" y="2" width="12" height="12" rx="3.5" fill="#F5C21A"/></svg>
      <div><h1>Jelly Smash</h1><p>Level builder</p></div>
    </div>
    <div class="rail-tools"><input type="search" id="lvSearch" placeholder="Filter levels" aria-label="Filter levels"></div>
    <div class="rail-tools">
      <button class="rbtn" id="lvNew" type="button">New</button>
      <button class="rbtn" id="lvDup" type="button">Duplicate</button>
      <button class="rbtn" id="lvUp" type="button" aria-label="Move level up">↑</button>
      <button class="rbtn" id="lvDown" type="button" aria-label="Move level down">↓</button>
      <button class="rbtn danger" id="lvDel" type="button">Delete</button>
    </div>
    <ul class="list" id="lvList"></ul>
    <div class="rail-foot">
      <button class="rbtn" id="btnImport" type="button">Import</button>
      <button class="rbtn" id="btnExport" type="button">Export</button>
      <button class="rbtn danger" id="btnReset" type="button">Reset to sheet</button>
      <small id="saveNote">Changes are saved in this browser.</small>
    </div>
  </aside>

  <section class="mid" aria-label="Level">
    <div class="bar">
      <span class="lvtitle" id="lvTitle">L1</span>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="modeEdit" aria-pressed="true">Design</button>
        <button type="button" id="modePlay" aria-pressed="false">Play test</button>
      </div>
      <div class="grp" data-edit>
        <button class="tb" id="tUndo" type="button" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">Undo</span></button>
        <button class="tb" id="tRedo" type="button" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="lbl">Redo</span></button>
      </div>
      <div class="grp" data-edit role="group" aria-label="Ant wall tools">
        <span class="hint gl">Wall</span>
        <button class="tb" data-tool="color" type="button" title="Paint ant color (C)">Color</button>
        <button class="tb" data-tool="hp" type="button" title="Set HP: 1 = normal ant, 2+ = Armored Ant (H)">HP</button>
        <button class="tb" data-tool="queen" type="button" title="Place a 2×2 Queen Ant (Q)">Queen</button>
        <button class="tb" data-tool="erase" type="button" title="Empty cell (E)">Erase</button>
      </div>
      <div class="grp" data-edit role="group" aria-label="Board tools">
        <span class="hint gl">Board</span>
        <button class="tb" data-tool="cell" type="button" title="Add or remove board cells (B)">Cell</button>
        <button class="tb" data-tool="choco" type="button" title="Chocolate Layer (X)">Chocolate</button>
        <button class="tb" data-tool="tray" type="button" title="Jelly Bottle tray, 2×2 (T)">Tray</button>
        <button class="tb" data-tool="clear" type="button" title="Remove an element">Clear</button>
      </div>
      <div class="grp" data-edit><label class="hint" for="zoom">View</label><select id="zoom"><option value="width">Fit width</option><option value="height">Whole level</option></select></div>
      <div class="grp brush" data-edit id="brush"></div>
      <div class="grp" data-play hidden>
        <button class="tb" id="pRestart" type="button" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Restart</span></button>
        <button class="tb" id="pPause" type="button" aria-pressed="false" title="Pause (Space)">Pause</button>
        <label class="hint" for="pSpeed">Speed</label>
        <select id="pSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
        <button class="tb" id="pAuto" type="button" aria-pressed="false" title="Let the bot play">Bot plays</button>
        <label class="hint" for="pSeed">Seed</label>
        <input id="pSeed" type="number" class="seed" value="1" aria-label="Random seed">
      </div>
      <div class="grp" data-play hidden>
        <button class="bst" type="button" id="bHand" title="The fullest cannon fires all its ammo at any ant of its color">Hand <small id="nHand">0</small></button>
        <button class="bst" type="button" id="bShuffle" title="New board with a swap for each bottom-row color">Shuffle <small id="nShuffle">0</small></button>
        <button class="bst" type="button" id="bBomb" title="3 cannons of the bottom-row colors, 15 ammo each">Bomb <small id="nBomb">0</small></button>
      </div>
      <span class="spacer"></span>
      <button class="tb" id="tCopy" type="button" title="Copy this level's JSON"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v8A2.5 2.5 0 0 0 6.5 16H8"/></svg><span class="lbl">Copy JSON</span></button>
    </div>
    <div class="stage">
      <div class="editwrap" id="editWrap" data-edit><svg id="edit" role="application" aria-label="Level design. Click or drag to paint with the selected tool."></svg></div>
      <div class="playwrap" id="playWrap" data-play hidden>
        <canvas id="cv" aria-label="Play test"></canvas>
        <div class="pstats" id="pStats"></div>
      </div>
      <div class="banner" id="banner" hidden></div>
    </div>
  </section>

  <aside class="insp" aria-label="Inspector">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="level" aria-selected="true">Level</button>
      <button role="tab" data-tab="wall" aria-selected="false">Wall</button>
      <button role="tab" data-tab="board" aria-selected="false">Board</button>
      <button role="tab" data-tab="tuning" aria-selected="false">Tuning</button>
      <button role="tab" data-tab="check" aria-selected="false">Check <span class="badge" id="chkBadge">0</span></button>
      <button role="tab" data-tab="json" aria-selected="false">JSON</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header><h2 id="dlgTitle">Import</h2><button class="ib" id="dlgX" type="button" aria-label="Close">✕</button></header>
    <div class="bd" id="dlgBody"></div>
    <footer id="dlgFoot"></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
